name: Snake de contribuições

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#000000&color_dots=#ebebeb,#c4c4c4,#8f8f8f,#565656,#1a1a1a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#111111,#333333,#666666,#a3a3a3,#ffffff&color_background=#000000
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
