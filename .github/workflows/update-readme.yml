name: Atualizar README

on:
  schedule:
    - cron: '0 9 * * *' # todo dia às 06:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar seções automáticas
        env:
          # Opcional: crie o secret README_PAT (token com acesso de leitura aos seus repositórios)
          # para incluir os privados no cálculo de linguagens. Sem ele, usa só os públicos.
          GH_TOKEN: ${{ secrets.README_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza README automaticamente"
          git push
